modules:
  - id: 1
    title: "The Gospel: Salvation by Grace Through Faith"
    subtitle: "Understanding who Jesus is and what He has done"
    description: >
      Discover the heart of the Christian faith: that we are saved by grace through faith in Jesus Christ alone.
      This module covers creation, the fall, the person and work of Christ, repentance, and new birth.
    key_scriptures:
      - "John 3:16"
      - "Ephesians 2:8-9"
      - "Romans 3:23-24"
      - "2 Corinthians 5:17"
    sections:
      - title: "Why We Need a Saviour"
        content: "Placeholder content - to be developed by elders and writers. Discuss sin, separation from God, and the human condition according to Scripture."
        reflection: "What does the Bible say about humanity's need for salvation?"
      - title: "Who Is Jesus?"
        content: "Placeholder: Fully God, fully man. His life, death, and resurrection."
        reflection: "How does the identity of Jesus shape your understanding of the gospel?"
      - title: "Responding in Faith"
        content: "Placeholder: Repentance, belief, and the free gift of salvation."
        reflection: "Have you personally responded to the gospel? If so, share briefly (optional)."
    status: "skeleton"

